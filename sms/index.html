<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <!-- Popper JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <h2 class="text-center text-danger pt-5 font-weight-bold">Student Management System</h2>

        <!-- container start here -->
        <div class="container bg-danger formsetting"> 
            <h3 class="text-white text-center py-3">Admin Login | Register Panel</h3>

            <!-- Row start here -->
            <div class="row">
                <div class="col-md-6 col-12">
                    <img src="stu.png" class="img-fluid" alt="student image">
                </div>

                <!-- Login form -->
                <div class="col-md-6 col-12">
                    <form method="post" action="index.php">
                        <div class="form-group">
                            <label class="text-white">Username</label>
                            <input type="text" name="username" placeholder="Enter your username" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label class="text-white">Password</label>
                            <input type="password" name="password" placeholder="Enter your password" class="form-control" required>
                        </div>

                        <input type="submit" name="login" value="Login" class="btn btn-light">
                        <input type="submit" name="register" value="Register" class="btn btn-dark">
                    </form>
                </div>
            </div>
            <!-- Row end here -->

        </div> 
        <!-- container end here -->
    </section>
</body>
</html>
